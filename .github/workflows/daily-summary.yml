name: Daily inbox summary

on:
  schedule:
    # 01:41 UTC = 07:11 IST. Deliberately an odd minute: GitHub drops/delays
    # scheduled runs most at the top of the hour and on :00/:15/:30/:45.
    - cron: "41 1 * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # imap_summary.py uses only the Python standard library — no pip install.
      - name: Send summary
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python imap_summary.py
