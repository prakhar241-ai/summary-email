name: Daily inbox summary

# The daily 7 AM run now happens on the laptop (Windows task
# SummaryEmail_Daily7AM). The cron that used to live here never once fired --
# GitHub silently skipped every scheduled run -- so it was removed rather than
# left looking functional.
#
# This workflow is kept as a manual backup: Actions tab -> Run workflow, useful
# when the laptop is off. To restore the schedule, re-add:
#   schedule:
#     - cron: "41 1 * * *"   # 07:11 IST
on:
  workflow_dispatch: {}

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # imap_summary.py uses only the Python standard library — no pip install.
      - name: Send summary
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python imap_summary.py
